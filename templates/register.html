{% extends "base.html" %}

{% block title %}회원가입{% endblock %}

{% block content %}
  <section class="auth-card card">
    <div class="auth-heading">
      <span class="eyebrow">Create account</span>
      <h1>기록을 시작해 볼까요?</h1>
      <p>간단한 정보만 입력하면 바로 시작할 수 있어요.</p>
    </div>

    <form method="post">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="30"
               value="{{ request.form.get('username', '') }}"
               placeholder="3~30자로 입력" required autofocus>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" minlength="8"
               placeholder="8자 이상 입력" required>
      </div>
      <div class="field">
        <label for="password_confirm">비밀번호 확인</label>
        <input id="password_confirm" name="password_confirm" type="password" minlength="8"
               placeholder="비밀번호를 한 번 더 입력" required>
      </div>
      <button class="button button-full" type="submit">계정 만들기</button>
    </form>

    <p class="auth-switch">이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>
  </section>
{% endblock %}

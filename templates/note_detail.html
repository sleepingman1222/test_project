{% extends "base.html" %}

{% block title %}{{ note['title'] }}{% endblock %}

{% block content %}
  <article class="detail-card card">
    <a class="back-link" href="{{ url_for('note_list') }}">← 목록으로</a>
    <header class="note-heading">
      <h1>{{ note['title'] }}</h1>
      <time>작성 {{ note['created_at'] }} · 수정 {{ note['updated_at'] }}</time>
    </header>
    <div class="note-content">{{ note['content'] }}</div>
    <div class="detail-actions">
      <a class="button button-secondary" href="{{ url_for('note_edit', public_id=note['public_id']) }}">수정</a>
      <form method="post" action="{{ url_for('note_delete', public_id=note['public_id']) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="button button-danger" type="submit">삭제</button>
      </form>
    </div>
  </article>
{% endblock %}

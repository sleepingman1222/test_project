{% extends "base.html" %}

{% block title %}로그인{% endblock %}

{% block content %}
  <section class="auth-card card">
    <div class="auth-heading">
      <span class="eyebrow">Welcome back</span>
      <h1>다시 만나서 반가워요.</h1>
      <p>아이디와 비밀번호를 입력해 주세요.</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" maxlength="30"
               value="{{ request.form.get('username', '') }}"
               placeholder="아이디 입력" required autofocus>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" maxlength="128"
               placeholder="비밀번호 입력" required>
      </div>
      <button class="button button-full" type="submit">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없나요? <a href="{{ url_for('register') }}">회원가입</a></p>
  </section>
{% endblock %}
